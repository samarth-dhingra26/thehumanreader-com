<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Human Reader</title>
<meta name="description" content="Your essays need to be you. Not AI.">
<style>
  :root {
    color-scheme: dark light;
    --bg: #0b0b0c;
    --fg: #f2f0ea;
    --muted: #8a8781;
    --accent: #d98e48;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f7f5f0;
      --fg: #161512;
      --muted: #6b6862;
      --accent: #b5652a;
    }
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
  }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: "Iowan Old Style", "Palatino Linotype", Georgia, "Times New Roman", serif;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 2rem;
  }
  main {
    max-width: 34rem;
  }
  h1 {
    font-size: clamp(2rem, 6vw, 3rem);
    font-weight: 500;
    letter-spacing: -0.01em;
    margin: 0 0 1.1rem;
  }
  p.tagline {
    font-size: clamp(1.1rem, 2.6vw, 1.35rem);
    color: var(--muted);
    margin: 0 0 2.2rem;
    line-height: 1.5;
    font-style: italic;
  }
  p.status {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    font-size: 0.8rem;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--accent);
    margin: 0;
  }
  .rule {
    width: 2.5rem;
    height: 1px;
    background: var(--muted);
    opacity: 0.5;
    margin: 0 auto 2.2rem;
  }
</style>
</head>
<body>
<main>
  <h1>The Human Reader</h1>
  <div class="rule"></div>
  <p class="tagline">Your essays need to be you.<br>Not AI.</p>
  <p class="status">Coming soon</p>
</main>
</body>
</html>
